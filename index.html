<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Plata - Investimentos</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-input: #1e293b;
      --accent-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --nav-height: 65px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
    
    .app-viewport {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-main);
      position: relative;
      padding-bottom: calc(var(--nav-height) + 20px);
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    .hidden { display: none !important; }

    /* --- AUTH SCREEN --- */
    .auth-container {
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }
    .auth-brand { text-align: center; margin-bottom: 30px; }
    .auth-brand i { font-size: 3rem; color: var(--accent-cyan); margin-bottom: 10px; }
    .auth-brand h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }
    .auth-brand p { color: var(--text-muted); font-size: 0.9rem; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .form-control {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    .form-control:focus { outline: none; border-color: var(--accent-cyan); }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }
    .btn-primary { background: var(--accent-blue); color: #fff; margin-top: 10px; }
    .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); margin-top: 10px; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }

    /* --- HEADER APP --- */
    .app-header {
      padding: 20px 20px 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-main);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .user-info-brief { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-blue); display: flex; justify-content: center; align-items: center; font-weight: 700; color: #fff; }
    .greeting { font-size: 0.8rem; color: var(--text-muted); }
    .user-name-title { font-size: 1rem; font-weight: 600; color: var(--text-main); }

    /* --- TABS SYSTEM --- */
    .tab-content { padding: 15px 20px; display: none; }
    .tab-content.active { display: block; }

    /* --- DASHBOARD VIEW --- */
    .balance-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .balance-title { font-size: 0.85rem; color: var(--text-muted); }
    .balance-value { font-size: 2rem; font-weight: 700; color: var(--accent-green); margin: 8px 0; }
    
    .section-header { font-size: 1rem; font-weight: 600; color: var(--accent-cyan); margin: 20px 0 12px 0; }
    
    .plans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .plan-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .plan-title { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
    .plan-price { font-size: 1.1rem; font-weight: 700; color: var(--accent-cyan); margin: 6px 0 12px 0; }
    .plan-btn { padding: 8px; font-size: 0.85rem; border-radius: 8px; background: var(--accent-green); color: #fff; border: none; font-weight: 600; cursor: pointer; width: 100%; }

    /* --- TRANSACTIONS & NOTIFICATIONS VIEWS --- */
    .data-list { display: flex; flex-direction: column; gap: 10px; }
    .data-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .data-info { display: flex; flex-direction: column; gap: 4px; }
    .data-title { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
    .data-sub { font-size: 0.75rem; color: var(--text-muted); }
    .data-amount { font-size: 0.95rem; font-weight: 700; }
    
    .badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; text-transform: uppercase; }
    .badge-ativo, .badge-concluido { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
    .badge-pendente { background: rgba(234, 179, 8, 0.15); color: #eab308; }

    .notification-card {
      background: var(--bg-card);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    /* --- BOTTOM NAVIGATION BAR --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: var(--nav-height);
      background: var(--bg-card);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      width: 25%;
      transition: color 0.2s;
    }
    .nav-item i { font-size: 1.2rem; }
    .nav-item.active { color: var(--accent-cyan); }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- 1. TELA DE AUTENTICAÇÃO -->
    <div id="auth-section" class="auth-container">
      <div class="auth-brand">
        <i class="fa-solid fa-chart-line"></i>
        <h1>La Plata</h1>
        <p>Plataforma de Investimentos</p>
      </div>

      <div class="form-group" id="name-group" style="display: none;">
        <label>Nome Completo</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="auth-name" class="form-control" placeholder="Seu nome completo">
        </div>
      </div>

      <div class="form-group">
        <label>E-mail</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="auth-email" class="form-control" placeholder="seu@email.com">
        </div>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="auth-password" class="form-control" placeholder="••••••••">
        </div>
      </div>

      <button class="btn btn-primary" id="btn-submit">
        <span>Entrar</span> <i class="fa-solid fa-arrow-right"></i>
      </button>
      <button class="btn btn-secondary" id="btn-toggle-mode">Criar uma conta</button>
    </div>

    <!-- 2. PAINEL PRINCIPAL COM NAVEGAÇÃO -->
    <div id="dashboard-section" class="hidden">
      
      <!-- Top Header -->
      <div class="app-header">
        <div class="user-info-brief">
          <div class="avatar" id="avatar-initials">U</div>
          <div>
            <div class="greeting">Olá,</div>
            <div class="user-name-title" id="user-name">Carregando...</div>
          </div>
        </div>
      </div>

      <!-- ABA 1: INÍCIO / INVESTIMENTOS -->
      <div id="tab-home" class="tab-content active">
        <div class="balance-card">
          <div class="balance-title">Saldo Total Acumulado</div>
          <div class="balance-value" id="user-balance">$ 0.00</div>
        </div>

        <div class="section-header">Planos Recomendados</div>
        <div class="plans-grid">
          <div class="plan-card">
            <div class="plan-title">Plano Start</div>
            <div class="plan-price">$ 50.00</div>
            <button class="plan-btn" onclick="buyInvestment(50)">Investir</button>
          </div>
          <div class="plan-card">
            <div class="plan-title">Plano Pro</div>
            <div class="plan-price">$ 100.00</div>
            <button class="plan-btn" onclick="buyInvestment(100)">Investir</button>
          </div>
        </div>
      </div>

      <!-- ABA 2: HISTÓRICO DE TRANSAÇÕES -->
      <div id="tab-history" class="tab-content">
        <div class="section-header">Histórico de Transações</div>
        <div class="data-list" id="transactions-list">
          <div style="text-align: center; color: var(--text-muted); padding: 20px;">Buscando dados...</div>
        </div>
      </div>

      <!-- ABA 3: NOTIFICAÇÕES -->
      <div id="tab-notifications" class="tab-content">
        <div class="section-header">Suas Notificações</div>
        <div id="notifications-list">
          <div style="text-align: center; color: var(--text-muted); padding: 20px;">Buscando mensagens...</div>
        </div>
      </div>

      <!-- ABA 4: PERFIL -->
      <div id="tab-profile" class="tab-content">
        <div class="section-header">Configurações de Conta</div>
        
        <div class="form-group">
          <label>Nome Registrado</label>
          <input type="text" id="profile-name" class="form-control" readonly>
        </div>
        
        <div class="form-group">
          <label>E-mail da Conta</label>
          <input type="text" id="profile-email" class="form-control" readonly>
        </div>

        <div class="form-group">
          <label>ID do Usuário (UID)</label>
          <input type="text" id="profile-uid" class="form-control" readonly>
        </div>

        <button class="btn btn-danger" id="btn-logout" style="margin-top: 30px;">
          <i class="fa-solid fa-right-from-bracket"></i> Sair da Conta
        </button>
      </div>

      <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
      <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
          <i class="fa-solid fa-house"></i>
          <span>Início</span>
        </div>
        <div class="nav-item" onclick="switchTab('history')">
          <i class="fa-solid fa-receipt"></i>
          <span>Histórico</span>
        </div>
        <div class="nav-item" onclick="switchTab('notifications')">
          <i class="fa-solid fa-bell"></i>
          <span>Avisos</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
          <i class="fa-solid fa-user"></i>
          <span>Perfil</span>
        </div>
      </nav>

    </div>

  </div>

  <!-- SCRIPT MODULAR PRINCIPAL -->
  <script type="module">
    import { auth, db } from "./Js/firebase-config.js";
    import { 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      doc, setDoc, addDoc, collection, onSnapshot, query, where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let isSignUp = false;

    // --- CONTROLE DE ABAS (Navegação Inferior) ---
    window.switchTab = (tabName) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      const targetTab = document.getElementById(`tab-${tabName}`);
      if (targetTab) targetTab.classList.add('active');

      const activeNavIndex = ['home', 'history', 'notifications', 'profile'].indexOf(tabName);
      if (activeNavIndex !== -1) {
        document.querySelectorAll('.nav-item')[activeNavIndex].classList.add('active');
      }
    };

    // --- ALTERNAR LOGIN / CADASTRO ---
    const btnToggleMode = document.getElementById("btn-toggle-mode");
    const nameGroup = document.getElementById("name-group");
    const btnSubmit = document.getElementById("btn-submit");

    if (btnToggleMode) {
      btnToggleMode.addEventListener("click", () => {
        isSignUp = !isSignUp;
        if (isSignUp) {
          nameGroup.style.display = "block";
          btnSubmit.querySelector("span").innerText = "Cadastrar";
          btnToggleMode.innerText = "Já tenho uma conta";
        } else {
          nameGroup.style.display = "none";
          btnSubmit.querySelector("span").innerText = "Entrar";
          btnToggleMode.innerText = "Criar uma conta";
        }
      });
    }

    // --- AUTENTICAÇÃO (LOGIN E CADASTRO) ---
    if (btnSubmit) {
      btnSubmit.addEventListener("click", async () => {
        const emailInput = document.getElementById("auth-email").value.trim();
        const passwordInput = document.getElementById("auth-password").value.trim();
        const nameInput = document.getElementById("auth-name") ? document.getElementById("auth-name").value.trim() : "";

        if (!emailInput || !passwordInput) {
          alert("Preencha o e-mail e a senha.");
          return;
        }

        try {
          if (isSignUp) {
            if (!nameInput) {
              alert("Preencha o seu nome completo.");
              return;
            }
            
            const res = await createUserWithEmailAndPassword(auth, emailInput, passwordInput);
            
            // Gravação na coleção raiz 'users'
            await setDoc(doc(db, "users", res.user.uid), {
              uid: res.user.uid,
              name: nameInput,
              email: emailInput,
              balance: 0.00,
              createdAt: new Date().getTime()
            });

            // Gravação de notificação inicial na coleção raiz 'transactions'
            await addDoc(collection(db, "transactions"), {
              userId: res.user.uid,
              type: "notificacao",
              description: "Bem-vindo à plataforma La Plata! Sua conta foi criada com sucesso.",
              amount: 0.00,
              status: "concluido",
              createdAt: new Date().getTime()
            });

            alert("Conta criada com sucesso!");
          } else {
            await signInWithEmailAndPassword(auth, emailInput, passwordInput);
          }
        } catch (error) {
          console.error(error);
          alert("Erro de autenticação: " + error.message);
        }
      });
    }

    // --- SESSÃO DO USUÁRIO & CARREGAMENTO EM TEMPO REAL ---
    onAuthStateChanged(auth, (user) => {
      const authSection = document.getElementById("auth-section");
      const dashboardSection = document.getElementById("dashboard-section");

      if (user) {
        authSection.classList.add("hidden");
        dashboardSection.classList.remove("hidden");
        
        document.getElementById("profile-email").value = user.email || "";
        document.getElementById("profile-uid").value = user.uid || "";

        loadUserData(user.uid);
        loadTransactions(user.uid);
        loadNotifications(user.uid);
      } else {
        authSection.classList.remove("hidden");
        dashboardSection.classList.add("hidden");
      }
    });

    // --- CARREGAR DADOS DO USUÁRIO ---
    function loadUserData(uid) {
      onSnapshot(doc(db, "users", uid), (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.data();
          const name = data.name || "Investidor";
          
          document.getElementById("user-name").innerText = name;
          document.getElementById("profile-name").value = name;
          document.getElementById("user-balance").innerText = `$ ${(data.balance || 0).toFixed(2)}`;
          document.getElementById("avatar-initials").innerText = name.charAt(0).toUpperCase();
        }
      });
    }

    // --- ADQUIRIR PLANO / INVESTIMENTO ---
    window.buyInvestment = async (amount) => {
      const user = auth.currentUser;
      if (!user) return alert("Usuário não autenticado.");

      if (!confirm(`Confirmar a aquisição do plano no valor de $${amount}?`)) return;

      try {
        await addDoc(collection(db, "transactions"), {
          userId: user.uid,
          type: "produto_adquirido",
          description: `Aquisição de Plano ($${amount})`,
          amount: amount,
          status: "ativo",
          createdAt: new Date().getTime()
        });

        alert("Investimento registrado com sucesso!");
      } catch (error) {
        alert("Erro ao efetuar compra: " + error.message);
      }
    };

    // --- ABA TRANSAÇÕES (Exclui notificações) ---
    function loadTransactions(uid) {
      const q = query(collection(db, "transactions"), where("userId", "==", uid));
      
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById("transactions-list");
        list.innerHTML = "";

        const items = [];
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          if (data.type !== "notificacao") {
            items.push({ id: docSnap.id, ...data });
          }
        });

        if (items.length === 0) {
          list.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">Nenhuma transação encontrada.</div>`;
          return;
        }

        items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        items.forEach(t => {
          const date = t.createdAt ? new Date(t.createdAt).toLocaleDateString("pt-BR") : "Recente";
          list.innerHTML += `
            <div class="data-card">
              <div class="data-info">
                <span class="data-title">${t.description}</span>
                <span class="data-sub">${date}</span>
              </div>
              <div>
                <span class="data-amount">$ ${(t.amount || 0).toFixed(2)}</span>
                <span class="badge badge-${t.status || 'ativo'}">${t.status || 'ativo'}</span>
              </div>
            </div>
          `;
        });
      });
    }

    // --- ABA NOTIFICAÇÕES (Exclui investimentos) ---
    function loadNotifications(uid) {
      const q = query(collection(db, "transactions"), where("userId", "==", uid));
      
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById("notifications-list");
        list.innerHTML = "";

        const items = [];
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          if (data.type === "notificacao") {
            items.push({ id: docSnap.id, ...data });
          }
        });

        if (items.length === 0) {
          list.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 20px;">Sem notificações no momento.</div>`;
          return;
        }

        items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        items.forEach(n => {
          const date = n.createdAt ? new Date(n.createdAt).toLocaleString("pt-BR") : "Recente";
          list.innerHTML += `
            <div class="notification-card">
              <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px;">${date}</div>
              <div style="font-size: 0.9rem; color: var(--text-main);">${n.description}</div>
            </div>
          `;
        });
      });
    }

    // --- LOGOUT ---
    const btnLogout = document.getElementById("btn-logout");
    if (btnLogout) {
      btnLogout.addEventListener("click", () => signOut(auth));
    }
  </script>
</body>
</html>
