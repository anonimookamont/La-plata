<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Plata - Plataforma de Investimentos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 480px; background: #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .hidden { display: none !important; }
    h2, h3 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
    input:focus { outline: none; border-color: #38bdf8; }
    .btn { width: 100%; padding: 12px; background: #0284c7; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
    .btn:hover { background: #0369a1; }
    .btn-secondary { background: transparent; border: 1px solid #334155; color: #94a3b8; }
    .btn-danger { background: #ef4444; margin-top: 20px; }
    .card-balance { background: #0f172a; padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 1px solid #334155; }
    .balance-amount { font-size: 1.8rem; font-weight: bold; color: #22c55e; margin-top: 5px; }
    .grid-plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .plan-card { background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; text-align: center; }
    .plan-card h4 { color: #f8fafc; font-size: 0.95rem; margin-bottom: 5px; }
    .plan-card button { width: 100%; padding: 8px; background: #22c55e; border: none; border-radius: 6px; color: #fff; font-weight: bold; margin-top: 8px; cursor: pointer; }
    .section-title { font-size: 1rem; color: #38bdf8; margin: 20px 0 10px 0; border-bottom: 1px solid #334155; padding-bottom: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; }
    .badge-approved { color: #22c55e; font-weight: bold; }
    .badge-pending { color: #eab308; font-weight: bold; }
    .badge-rejected { color: #ef4444; font-weight: bold; }
    .notifications-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; max-height: 150px; overflow-y: auto; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. TELA DE AUTENTICAÇÃO -->
    <div id="auth-section">
      <h2 id="auth-title">Login do Investidor</h2>
      
      <div class="form-group" id="name-group" style="display: none;">
        <label>Nome Completo</label>
        <input type="text" id="auth-name" placeholder="O seu nome">
      </div>

      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="auth-email" placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="auth-password" placeholder="••••••••">
      </div>

      <button class="btn" id="btn-submit">Entrar</button>
      <button class="btn btn-secondary" id="btn-toggle-mode">Criar uma conta</button>
    </div>

    <!-- 2. PAINEL PRINCIPAL (DASHBOARD) -->
    <div id="dashboard-section" class="hidden">
      <h3>Bem-vindo, <span id="user-name">Investidor</span>!</h3>

      <!-- SALDO -->
      <div class="card-balance">
        <small style="color: #94a3b8;">Saldo Disponível</small>
        <div class="balance-amount" id="user-balance">$ 0.00</div>
      </div>

      <!-- PLANOS DE INVESTIMENTO -->
      <div class="section-title">Planos Disponíveis</div>
      <div class="grid-plans">
        <div class="plan-card">
          <h4>Plano Start</h4>
          <small>$ 50.00</small>
          <button onclick="buyInvestment(50)">Investir</button>
        </div>
        <div class="plan-card">
          <h4>Plano Pro</h4>
          <small>$ 100.00</small>
          <button onclick="buyInvestment(100)">Investir</button>
        </div>
      </div>

      <!-- SEÇÃO 1: APENAS TRANSAÇÕES -->
      <div class="section-title">Histórico de Transações</div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Tipo</th>
              <th>Descrição</th>
              <th>Valor</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="transactions-list">
            <tr>
              <td colspan="5" style="text-align: center; color: #94a3b8;">A carregar transações...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- SEÇÃO 2: APENAS NOTIFICAÇÕES -->
      <div class="section-title">Notificações da Conta</div>
      <div class="notifications-box" id="notifications-list">
        <div style="text-align: center; color: #94a3b8; padding: 10px;">A carregar notificações...</div>
      </div>

      <!-- PERFIL E SAÍDA -->
      <div class="section-title">Dados da Conta</div>
      <div class="form-group">
        <label>E-mail Registado</label>
        <input type="text" id="profile-email" readonly disabled>
      </div>
      <div class="form-group">
        <label>ID do Utilizador (UID)</label>
        <input type="text" id="profile-uid" readonly disabled>
      </div>

      <button class="btn btn-danger" id="btn-logout">Encerrar Sessão (Log out)</button>
    </div>

  </div>

  <!-- IMPORTAÇÃO DO SCRIPT PRINCIPAL -->
  <script type="module" src="./Js/Index.js?v=3.0"></script>
</body>
</html>
