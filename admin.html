<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lá Plata - Painel Administrativo</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-card: #121217;
      --bg-card-border: #22222d;
      --bg-input: #171720;
      
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa7c11 100%);
      --gold-gradient-button: linear-gradient(135deg, #e6c865 0%, #d4af37 100%);
      
      --text-main: #f8fafc;
      --text-muted: #8e8ea0;
      --border-gold: rgba(212, 175, 55, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #000000; color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
    
    .admin-container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      background-color: var(--bg-dark);
      padding: 24px 20px;
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
      border-left: 1px solid #1a1a22;
      border-right: 1px solid #1a1a22;
    }

    .hidden { display: none !important; }

    /* HEADER */
    .admin-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1c1c26;
    }
    .lion-svg-icon {
      width: 45px;
      height: 45px;
      filter: drop-shadow(0px 2px 8px rgba(212, 175, 55, 0.4));
      margin-bottom: 4px;
    }
    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .admin-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 800;
      color: #000;
      background: var(--gold-primary);
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* FORMULÁRIOS & CARDS */
    .admin-card {
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold-primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-input);
      border: 1px solid var(--bg-card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
    }
    .form-control:focus { outline: none; border-color: var(--gold-primary); }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-gold { background: var(--gold-gradient-button); color: #000; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 12px; font-size: 0.8rem; }
    .btn-success { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); padding: 8px 12px; font-size: 0.8rem; }

    /* NAVEGAÇÃO DE ABAS ADMIN */
    .admin-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .admin-tab-btn {
      flex: 1;
      padding: 10px;
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      color: var(--text-muted);
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .admin-tab-btn.active {
      background: rgba(212, 175, 55, 0.12);
      color: var(--gold-primary);
      border-color: var(--border-gold);
    }

    /* LISTA DE DADOS ADMIN */
    .data-item {
      background: var(--bg-input);
      border: 1px solid var(--bg-card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .data-header { display: flex; justify-content: space-between; align-items: center; }
    .data-main { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .data-sub { font-size: 0.78rem; color: var(--text-muted); }
    .data-actions { display: flex; gap: 8px; margin-top: 6px; }

    /* MODAL CUSTOMIZADO */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
    }
    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border-gold);
      border-radius: 16px; padding: 20px; max-width: 340px; width: 100%; text-align: center;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <!-- HEADER DA APLICAÇÃO ADMIN -->
    <div class="admin-header">
      <svg class="lion-svg-icon" viewBox="0 0 100 100">
        <path fill="#d4af37" d="M50 10 C30 10, 15 25, 15 45 C15 58, 22 68, 30 75 C32 65, 38 55, 45 52 C42 48, 40 42, 42 36 C45 28, 55 28, 58 36 C60 42, 58 48, 55 52 C62 55, 68 65, 70 75 C78 68, 85 58, 85 45 C85 25, 70 10, 50 10 Z"/>
      </svg>
      <div class="brand-name">LÁ PLATA</div>
      <span class="admin-badge">Painel de Controle Admin</span>
    </div>

    <!-- TELA DE AUTENTICAÇÃO PIN ADMIN -->
    <div id="admin-login-section" class="admin-card">
      <div class="card-title"><i class="fa-solid fa-lock"></i> Acesso Restrito</div>
      <div class="form-group">
        <label>Chave do Administrador</label>
        <input type="password" id="admin-pin" class="form-control" placeholder="Digite a chave secreta">
      </div>
      <button class="btn btn-gold" onclick="loginAdmin()">Entrar no Painel</button>
    </div>

    <!-- ÁREA PRINCIPAL DO ADMIN -->
    <div id="admin-dashboard" class="hidden">
      
      <!-- MENU DE ABAS ADMIN -->
      <div class="admin-tabs">
        <button class="admin-tab-btn active" onclick="switchAdminTab('plans')"><i class="fa-solid fa-cubes"></i> Carteiras</button>
        <button class="admin-tab-btn" onclick="switchAdminTab('withdraws')"><i class="fa-solid fa-wallet"></i> Saques</button>
        <button class="admin-tab-btn" onclick="switchAdminTab('users')"><i class="fa-solid fa-users"></i> Clientes</button>
      </div>

      <!-- ABA 1: GERENCIAR CARTEIRAS / PLANOS -->
      <div id="admin-tab-plans">
        <div class="admin-card">
          <div class="card-title"><i class="fa-solid fa-plus-circle"></i> Nova Carteira de Investimento</div>
          
          <div class="form-group">
            <label>Título do Plano</label>
            <input type="text" id="plan-title" class="form-control" placeholder="Ex: Carteira Ouro - 10 Dias">
          </div>

          <div class="form-group">
            <label>Aporte Inicial ($)</label>
            <input type="number" id="plan-price" class="form-control" placeholder="Ex: 100.00" step="0.01">
          </div>

          <div class="form-group">
            <label>Prazo de Duração (Dias)</label>
            <input type="number" id="plan-days" class="form-control" placeholder="Ex: 10">
          </div>

          <div class="form-group">
            <label>Retorno Total ($ Capital + Lucro)</label>
            <input type="number" id="plan-return" class="form-control" placeholder="Ex: 130.00" step="0.01">
          </div>

          <button class="btn btn-gold" onclick="createPlan()"><i class="fa-solid fa-save"></i> Criar Carteira</button>
        </div>

        <div class="card-title"><i class="fa-solid fa-list"></i> Carteiras Ativas no App</div>
        <div id="plans-list-container">
          <div style="text-align: center; color: var(--text-muted); padding: 15px;">A carregar planos...</div>
        </div>
      </div>

      <!-- ABA 2: APROVAR SAQUES -->
      <div id="admin-tab-withdraws" class="hidden">
        <div class="card-title"><i class="fa-solid fa-clock"></i> Solicitações de Resgate PENDENTES</div>
        <div id="withdraws-list-container">
          <div style="text-align: center; color: var(--text-muted); padding: 15px;">Nenhuma solicitação pendente.</div>
        </div>
      </div>

      <!-- ABA 3: LISTA DE CLIENTES -->
      <div id="admin-tab-users" class="hidden">
        <div class="card-title"><i class="fa-solid fa-users-gear"></i> Clientes Cadastrados</div>
        <div id="users-list-container">
          <div style="text-align: center; color: var(--text-muted); padding: 15px;">Buscando usuários...</div>
        </div>
      </div>

    </div>

  </div>

  <!-- MODAL DE ALERTA -->
  <div id="admin-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div style="font-size: 2rem; color: var(--gold-primary); margin-bottom: 10px;"><i class="fa-solid fa-circle-info"></i></div>
      <div id="modal-text" style="font-size: 0.9rem; color: #fff; margin-bottom: 16px;">Mensagem</div>
      <button class="btn btn-gold" onclick="closeAdminModal()">OK</button>
    </div>
  </div>

  <!-- SCRIPT MODULAR ADMIN -->
  <script type="module">
    import { db } from "./Js/firebase-config.js";
    import { 
      collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, where, getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // CHAVE ADMIN PADRÃO (Altere para a sua chave preferida)
    const ADMIN_SECRET_PIN = "laplata123";

    window.showModal = (msg) => {
      document.getElementById("modal-text").innerText = msg;
      document.getElementById("admin-modal").classList.remove("hidden");
    };

    window.closeAdminModal = () => {
      document.getElementById("admin-modal").classList.add("hidden");
    };

    window.loginAdmin = () => {
      const pin = document.getElementById("admin-pin").value;
      if (pin === ADMIN_SECRET_PIN) {
        document.getElementById("admin-login-section").classList.add("hidden");
        document.getElementById("admin-dashboard").classList.remove("hidden");
        loadAdminData();
      } else {
        showModal("Chave de acesso inválida!");
      }
    };

    window.switchAdminTab = (tabName) => {
      document.querySelectorAll(".admin-tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("admin-tab-plans").classList.add("hidden");
      document.getElementById("admin-tab-withdraws").classList.add("hidden");
      document.getElementById("admin-tab-users").classList.add("hidden");

      document.getElementById(`admin-tab-${tabName}`).classList.remove("hidden");
      event.currentTarget.classList.add("active");
    };

    function loadAdminData() {
      loadPlans();
      loadWithdraws();
      loadUsers();
    }

    // 1. CRIAR NOVA CARTEIRA/PLANO
    window.createPlan = async () => {
      const title = document.getElementById("plan-title").value.trim();
      const price = parseFloat(document.getElementById("plan-price").value);
      const days = parseInt(document.getElementById("plan-days").value);
      const totalReturn = parseFloat(document.getElementById("plan-return").value);

      if (!title || !price || !days || !totalReturn) {
        return showModal("Preencha todos os campos da carteira!");
      }

      try {
        await addDoc(collection(db, "plans"), {
          title: title,
          price: price,
          durationDays: days,
          totalReturn: totalReturn,
          createdAt: Date.now()
        });

        document.getElementById("plan-title").value = "";
        document.getElementById("plan-price").value = "";
        document.getElementById("plan-days").value = "";
        document.getElementById("plan-return").value = "";

        showModal("Carteira criada com sucesso!");
      } catch (err) {
        showModal("Erro ao criar carteira: " + err.message);
      }
    };

    // LISTAR CARTEIRAS E BOTÃO DE EXCLUIR
    function loadPlans() {
      onSnapshot(collection(db, "plans"), (snapshot) => {
        const container = document.getElementById("plans-list-container");
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 15px;">Nenhuma carteira cadastrada.</div>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const plan = docSnap.data();
          const id = docSnap.id;

          container.innerHTML += `
            <div class="data-item">
              <div class="data-header">
                <span class="data-main">${plan.title}</span>
                <button class="btn btn-danger" onclick="deletePlan('${id}')"><i class="fa-solid fa-trash"></i> Excluir</button>
              </div>
              <div class="data-sub">Aporte: <b>$ ${(plan.price || 0).toFixed(2)}</b> | Prazo: <b>${plan.durationDays} Dias</b></div>
              <div class="data-sub" style="color: var(--gold-primary);">Retorno Previsto: <b>$ ${(plan.totalReturn || 0).toFixed(2)}</b></div>
            </div>
          `;
        });
      });
    }

    window.deletePlan = async (id) => {
      if (confirm("Deseja realmente excluir esta carteira?")) {
        await deleteDoc(doc(db, "plans", id));
        showModal("Carteira excluída!");
      }
    };

    // 2. APROVAR OU REJEITAR SAQUES PENDENTES
    function loadWithdraws() {
      const q = query(collection(db, "transactions"), where("type", "==", "saque"), where("status", "==", "pendente"));
      
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById("withdraws-list-container");
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 15px;">Nenhuma solicitação pendente.</div>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const trans = docSnap.data();
          const id = docSnap.id;

          container.innerHTML += `
            <div class="data-item">
              <div class="data-header">
                <span class="data-main">$ ${(trans.amount || 0).toFixed(2)}</span>
                <span style="font-size: 0.75rem; color: #eab308; font-weight: 700;">PENDENTE</span>
              </div>
              <div class="data-sub">Usuário UID: ${trans.userId}</div>
              <div class="data-actions">
                <button class="btn btn-success" onclick="approveWithdraw('${id}')"><i class="fa-solid fa-check"></i> Aprovar</button>
                <button class="btn btn-danger" onclick="rejectWithdraw('${id}', '${trans.userId}', ${trans.amount})"><i class="fa-solid fa-times"></i> Rejeitar & Estornar</button>
              </div>
            </div>
          `;
        });
      });
    }

    window.approveWithdraw = async (transId) => {
      await updateDoc(doc(db, "transactions", transId), { status: "concluido" });
      showModal("Saque APROVADO com sucesso!");
    };

    window.rejectWithdraw = async (transId, userId, amount) => {
      // Altera status para rejeitado e estorna o valor de volta para o saldo do usuário
      await updateDoc(doc(db, "transactions", transId), { status: "rejeitado" });
      await updateDoc(doc(db, "users", userId), { balance: increment(amount) });
      showModal("Saque REJEITADO e valor estornado ao cliente!");
    };

    // 3. LISTA DE CLIENTES
    function loadUsers() {
      onSnapshot(collection(db, "users"), (snapshot) => {
        const container = document.getElementById("users-list-container");
        container.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const u = docSnap.data();
          container.innerHTML += `
            <div class="data-item">
              <div class="data-header">
                <span class="data-main">${u.name || 'Sem nome'}</span>
                <span style="color: var(--gold-primary); font-weight: 700;">$ ${(u.balance || 0).toFixed(2)}</span>
              </div>
              <div class="data-sub"><i class="fa-solid fa-envelope"></i> ${u.email}</div>
              <div class="data-sub"><i class="fa-solid fa-phone"></i> ${u.phone || 'N/A'}</div>
              <div class="data-sub"><i class="fa-solid fa-tag"></i> Afiliado: <b>${u.refCode || 'N/A'}</b></div>
            </div>
          `;
        });
      });
    }
  </script>
</body>
</html>
